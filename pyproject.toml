[project]
name = "semgraph"
version = "0.1.0"
description = "Semantic graph clustering pipeline with BERT node features and GraphMAE representations."
requires-python = ">=3.9,<3.12"
dependencies = [
    "colorama>=0.4.6",
    "contractions>=0.1.73",
    "cython>=3.0",
    "dgl>=2.1,<2.2",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "matplotlib>=3.8",
    "kneed>=0.8.5",
    "networkx>=3.2",
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "spacy>=3.7.4,<3.8",
    "tensorboardx>=2.6",
    "torch==2.2.1",
    "torchdata>=0.7,<0.8",
    "torch-geometric>=2.6,<2.7",
    "tqdm>=4.66",
    "transformers>=4.45",
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
research = [
    "datasets>=3.0",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "ogb>=1.3",
    "python-louvain>=0.16",
]

[tool.uv]
package = false
